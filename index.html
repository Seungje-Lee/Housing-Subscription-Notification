<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>부동산 청약 알림 서비스</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- <link rel="stylesheet" href="https://unpkg.com/mvp.css" /> -->
  <link rel="stylesheet" href="./admin-styles.css" />
</head>
<body>
  <h1>부동산 청약 정보 알림 서비스</h1>
  <p>
    청약홈에서 제공하는 청약 정보 알림 서비스를 개선하여 개수 제한 없이, 보다 자세한 설명을 첨부하여 알림으로 제공하는 서비스입니다.
  </p>
  <form id="login-form">
    <input id="email" type="email" required placeholder="알림을 받을 이메일 주소">
    <input id="password" type="password" required placeholder="비밀번호">
    <input type="submit" value="로그인">
  </form>
  <script src="js/admin.js"></script>
</body>
</html>
