<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>부동산 청약 알림 서비스</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <link rel="stylesheet" href="https://unpkg.com/mvp.css" /> -->
    <link rel="stylesheet" href="./admin-styles.css" />
  </head>
  <body>
    <h1>부동산 청약 정보 알림 서비스</h1>
    <p>
      청약홈에서 제공하는 청약 정보 알림 서비스를 개선하여 개수 제한 없이, 보다
      자세한 설명을 첨부하여 알림으로 제공하는 서비스입니다.
    </p>
    <!-- <div class="bg-image"></div> -->
    <form id="login-form">
      <!-- 이메일 유효성 검사를 위해 type을 email이 아닌 text로 함 -->
      <input id="email" type="text" required placeholder="이메일 주소" />
      <input id="password" type="password" required placeholder="비밀번호" />
      <button type="submit">로그인</button>
    </form>
    <span
      >계정이 없으신가요?
      <a href="/create-account.html">계정 생성 페이지로 이동</a></span
    >
    <span class="notification-msg"></span>

    <!-- switcher - 계정 만들기, 비번 재설저 등 하는 부분/ -->
    <!-- export const Switcher = styled.span`
  margin-top: 20px;
  a {
    color: #1d9bf0;
  } -->
    <script type="module" src="firebase.js"></script>
    <script type="module" src="js/admin.js"></script>
  </body>
</html>
